name: Run AI QA agent

on:
  issues:
    types: [labeled]

jobs:
  run-qa:
    if: github.event.label.name == 'qa-agent-run'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      issues: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Execute the QA ticket
        run: node scripts/run-gemini-qa-agent.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite

      - name: Post the report on the issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -s qa-report.md ]; then
            printf '**Blocked** — the workflow did not produce a test report.\n' > qa-report.md
          fi
          printf '\n[View the GitHub Actions run](%s)\n' "$RUN_URL" >> qa-report.md
          gh issue comment "$ISSUE_NUMBER" --body-file qa-report.md
